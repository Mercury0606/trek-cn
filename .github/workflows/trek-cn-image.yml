name: TREK CN container

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR after the map-data compliance review
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/trek-cn:latest

