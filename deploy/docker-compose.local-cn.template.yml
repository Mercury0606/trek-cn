# TREK CN local overlay template.
# Put this file next to the custom-atlas/ and custom-frontend/ directories.
# The two GeoJSON files are intentionally not included in the public repository.
services:
  app:
    image: mauriceboe/trek:4.2.1
    container_name: trek-cn
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:${TREK_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?请先在.env中设置ENCRYPTION_KEY}
      - TZ=${TZ:-Asia/Shanghai}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-zh}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - COOKIE_SECURE=false
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./custom-atlas/admin0.geojson.gz:/app/server/assets/atlas/admin0.geojson.gz:ro
      - ./custom-atlas/admin1.geojson.gz:/app/server/assets/atlas/admin1.geojson.gz:ro
      - ./custom-frontend/MAtlas-Dl6uc9sE.js:/app/server/public/assets/MAtlas-Dl6uc9sE.js:ro
      - ./custom-frontend/useAtlas-Cdw1eKU9.js:/app/server/public/assets/useAtlas-Cdw1eKU9.js:ro
      - ./custom-frontend/VectorBasemap-B_2s89GS.js:/app/server/public/assets/VectorBasemap-B_2s89GS.js:ro
      - ./custom-frontend/sw.js:/app/server/public/sw.js:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
